name: REUNIR Alpha 06 toolchain
on:
  push:
    branches: ['build/reunir-alpha-06']
    paths: ['.github/workflows/alpha06-toolchain.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned existing stack and open-source editor
        run: |
          mkdir toolchain
          cd toolchain
          cat > package.json <<'JSON'
          {"name":"reunir","version":"0.6.0","private":true,"type":"module","engines":{"node":">=22.12.0"},"dependencies":{"@axe-core/playwright":"4.13.0","@better-auth/drizzle-adapter":"1.7.5","@electric-sql/pglite":"0.5.8","@google-cloud/storage":"8.2.0","@hono/node-server":"2.1.1","@playwright/test":"1.63.0","@tanstack/react-query":"5.103.2","@types/node":"22.20.4","@types/pg":"8.23.1","@types/react":"19.3.0","@types/react-dom":"19.3.0","better-auth":"1.7.5","drizzle-orm":"0.45.3","hono":"4.13.9","lucide-react":"1.47.0","pg":"8.23.0","react":"19.3.0","react-dom":"19.3.0","react-router-dom":"7.18.4","tsx":"4.23.15","typescript":"5.9.3","vite":"7.3.6","zod":"4.6.5","@tiptap/react":"3.31.3","@tiptap/pm":"3.31.3","@tiptap/starter-kit":"3.31.3"}}
          JSON
          npm install --ignore-scripts
          tar czf ../reunir-alpha06-dependencies.tar.gz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: reunir-alpha06-dependencies
          path: reunir-alpha06-dependencies.tar.gz
          retention-days: 3
