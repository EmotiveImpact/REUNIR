name: REUNIR secure source import
on:
  push:
    branches: ['transfer/alpha06-secure-20260927']
    paths: ['.github/workflows/secure-source-transfer.yml']
permissions:
  contents: write
jobs:
  import-source:
    if: github.repository == 'EmotiveImpact/REUNIR'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Receive encrypted source capability and verify native Git tree
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, secrets, subprocess, tarfile, tempfile, time, urllib.error, urllib.parse, urllib.request
          REPO='EmotiveImpact/REUNIR'
          BRANCH='transfer/alpha06-secure-20260927'
          SOURCE='a09cd7db8f71462328b68a3c49b52dae4299dd97'
          ARCHIVE='7a2b7709e5a8fb73f24d59c131ffdbc7989a88a2c1b86bf312dc22b247c4cf3c'
          EXPECTED_TREE='5e242575bb7117cc13b83a8669f3a04e45ad34b0'
          MANIFEST='ced036b2579023c1d5dc633322e9740066b9133b308ac84883d61770356b98e7'
          def api(path, data=None, method=None):
              request=urllib.request.Request('https://api.github.com/repos/'+REPO+path, data=None if data is None else json.dumps(data).encode(), method=method, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def put(path, value):
              return api('/contents/'+path, {'message':'transfer: '+path, 'branch':BRANCH, 'content':base64.b64encode(json.dumps(value,indent=2).encode()).decode()}, 'PUT')
          class RestrictedRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  check_url(newurl)
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def check_url(url):
              parsed=urllib.parse.urlsplit(url)
              assert parsed.scheme=='https' and parsed.hostname and parsed.hostname.endswith('.oaiusercontent.com') and not parsed.username and not parsed.password
          stage='initialisation'
          try:
              with tempfile.TemporaryDirectory() as temp:
                  private=pathlib.Path(temp)/'ephemeral.pem'
                  subprocess.run(['openssl','genpkey','-algorithm','RSA','-pkeyopt','rsa_keygen_bits:2048','-out',str(private)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  os.chmod(private,0o600)
                  public=subprocess.check_output(['openssl','pkey','-in',str(private),'-pubout'],stderr=subprocess.DEVNULL).decode()
                  ticket=secrets.token_hex(16)
                  stage='public key publication'
                  put('transport/public-key.json',{'runId':os.environ['RUN_ID'],'ticket':ticket,'algorithm':'RSA-OAEP-SHA256','publicKey':public,'sourceCommit':SOURCE,'archiveSha256':ARCHIVE,'expiresInSeconds':660})
                  print('Ephemeral public key published; private key exists only in this job.',flush=True)
                  stage='encrypted capability receipt'
                  envelope=None
                  until=time.monotonic()+660
                  while time.monotonic()<until:
                      try:
                          result=api('/contents/transport/encrypted-capability.json?ref='+urllib.parse.quote(BRANCH,safe=''))
                          envelope=json.loads(base64.b64decode(result['content']))
                          break
                      except urllib.error.HTTPError as error:
                          if error.code!=404: raise
                      time.sleep(5)
                  assert envelope is not None and envelope['ticket']==ticket and str(envelope['runId'])==os.environ['RUN_ID']
                  assert 1<=len(envelope['chunks'])<=20
                  clear=[]
                  for block in envelope['chunks']:
                      ciphertext=base64.b64decode(block,validate=True)
                      assert len(ciphertext)==256
                      clear.append(subprocess.check_output(['openssl','pkeyutl','-decrypt','-inkey',str(private),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-pkeyopt','rsa_mgf1_md:sha256'],input=ciphertext,stderr=subprocess.DEVNULL))
                  capability=json.loads(b''.join(clear))
                  assert capability['ticket']==ticket and capability['archiveSha256']==ARCHIVE
                  check_url(capability['url'])
                  stage='source download'
                  opener=urllib.request.build_opener(RestrictedRedirect())
                  with opener.open(capability['url'],timeout=60) as response:
                      data=response.read(2_000_001)
                  assert len(data)==329476 and hashlib.sha256(data).hexdigest()==ARCHIVE
                  print('Complete source archive received and SHA-256 verified.',flush=True)
                  del capability,clear,envelope
                  stage='archive validation'
                  files={}
                  modes={}
                  total=0
                  with tarfile.open(fileobj=io.BytesIO(data),mode='r:xz') as archive:
                      for member in archive:
                          path=pathlib.PurePosixPath(member.name)
                          assert member.isfile() and not path.is_absolute() and '..' not in path.parts and '\\' not in member.name and str(path)==member.name
                          assert not set(path.parts)&{'.git','node_modules','.local','.vercel'}
                          assert not any(part.startswith('.env') and part!='.env.example' for part in path.parts)
                          assert member.name not in files and member.size<=2_000_000 and member.mode in (0o644,0o755)
                          total+=member.size
                          assert total<=10_000_000 and len(files)<400
                          files[member.name]=archive.extractfile(member).read()
                          modes[member.name]='100755' if member.mode==0o755 else '100644'
                  assert len(files)==204 and hashlib.sha256(files['SOURCE_MANIFEST.json']).hexdigest()==MANIFEST
                  manifest=json.loads(files['SOURCE_MANIFEST.json'])
                  assert len(manifest['files'])==203
                  assert set(files)=={row['path'] for row in manifest['files']}|{'SOURCE_MANIFEST.json'}
                  for row in manifest['files']:
                      assert hashlib.sha256(files[row['path']]).hexdigest()==row['sha256'] and len(files[row['path']])==row['bytes']
                  stage='native Git object creation'
                  entries=[]
                  for path,body in files.items():
                      entry={'path':path,'type':'blob','mode':modes[path]}
                      try: entry['content']=body.decode('utf-8')
                      except UnicodeDecodeError:
                          entry['sha']=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(body).decode()},'POST')['sha']
                      entries.append(entry)
                  tree=api('/git/trees',{'tree':entries},'POST')
                  assert tree['sha']==EXPECTED_TREE
                  stage='receipt publication'
                  put('transport/source-receipt.json',{'runId':os.environ['RUN_ID'],'sourceCommit':SOURCE,'archiveSha256':ARCHIVE,'sourceManifestSha256':MANIFEST,'manifestFiles':203,'totalFiles':204,'treeSha':tree['sha'],'exactNativeTreeVerified':True,'sourceBranchPublished':False,'note':'Native application tree is complete. The authorised connector must attach it to a reviewed source branch. No merge or deployment.'})
                  print('All 204 native files and exact original Git tree verified: '+tree['sha'],flush=True)
          except Exception:
              print('Source import failed during '+stage+'. No capability URL or credential is logged.',flush=True)
              raise SystemExit(1)
          PY
