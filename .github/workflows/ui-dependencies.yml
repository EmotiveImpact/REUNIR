name: REUNIR UI dependency bundle
on:
  push:
    branches: ['build/alpha07-ui-dependencies-20261002']
    paths: ['.github/workflows/ui-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve isolated UI dependencies
        run: |
          mkdir ui-dependencies
          cd ui-dependencies
          npm init -y
          npm install --ignore-scripts --save-exact react@19.3.0 react-dom@19.3.0 class-variance-authority@0.7.1 clsx@2.1.1 tailwind-merge@3.3.1 @radix-ui/react-slot@1.2.3 @radix-ui/react-dropdown-menu@2.1.16 @radix-ui/react-avatar@1.1.10 @tailwindcss/vite@4.1.10 tailwindcss@4.1.10
          tar czf ../reunir-ui-dependencies.tar.gz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: reunir-ui-dependencies
          path: reunir-ui-dependencies.tar.gz
          retention-days: 3
