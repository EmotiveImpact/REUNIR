name: REUNIR native source verification
on:
  push:
    branches: ['build/alpha06-source-import']
    paths: ['.github/workflows/source-transfer.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'EmotiveImpact/REUNIR'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify native source block
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/EmotiveImpact/REUNIR/git/blobs/2ae0717b038ed097567f728f5771a2eea21aaea1', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              obj=json.load(response)
          data=base64.b64decode(obj['content'])
          text=base64.b64encode(data).decode()
          print('Received bytes:',len(data),'Encoded:',len(text))
          text=text.replace('EtyiHeHeAB','EtyiHeAB')
          text=text[:19880]+'58CeHPT7F6VUnZ7uHMSPP2WCX0BWSIB6R050Obh1MrDRIRDgYMixV+PNYlc3vPC7Sij8GkyLDqNQcOKZaS9b4g/uT2Q/5DGzY6XYLPW3Duke3JPj0MFaqHpH'
          data=base64.b64decode(text,validate=True)
          sha=hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
          print('Recovered bytes:',len(data),'Git blob:',sha)
          assert sha=='e5e89d3f72186496ff0bb3fb45bb53d4fad7372f', 'Source block integrity failed'
          print('Native source transport verified exactly. No application publication claimed yet.')
          PY
